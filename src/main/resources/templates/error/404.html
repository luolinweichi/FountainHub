<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<!--
  ============================================================================
  404 页面（状态码由 Spring Boot 自动设置，会正确返回 404）
  ============================================================================
  ⚠️⚠️ 【为什么这一页不引用 fragments/layout —— 别改回去】

     错误页是整个应用【最后一道防线】，它自己绝不能再出错。

     而公共外壳（layout）依赖"模型数据"与"Spring Security 上下文"：
       · head 片段里有 `_csrf.token`（只在 CSRF 过滤器跑过的请求上才有）
       · nav  片段里有 sec:authorize（需要安全上下文）
     在【错误转发（ERROR dispatch）】这类场景下，这些数据可能并不存在 →
     公共外壳渲染失败 → 404 页面自己变成"又一个异常" →
     日志里刷 `Exception processing template "error/404.html"`。

     ✅ 所以本页【故意做成自包含】：只依赖 /css/fh.css（permitAll 的静态资源），
       不碰任何模型数据、不碰安全上下文 —— **渲染不可能失败**。
  ============================================================================
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>页面不存在</title>
    <!-- ⚠️ 直接写死路径，不走 Thymeleaf 链接表达式 —— 少一个可能的失败点 -->
    <link rel="stylesheet" href="/css/fh.css">
</head>
<body>
<div class="fh-center">
    <div class="fh-card fh-text-c">
        <div class="fh-bigcode fh-code-404">404</div>
        <h1 class="fh-title" style="font-size:24px">找不到这个页面</h1>
        <p class="fh-sub">网址可能输错了，或者这个页面还没做出来。</p>
        <a class="fh-btn fh-btn-main" href="/">回到首页</a>
    </div>
</div>
</body>
</html>
