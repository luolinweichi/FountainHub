<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<!-- 「修改密码」（T-008；T-043 视觉落地）—— 居中单列表单卡（docs/08 §5.2：460–560px） -->
<head th:replace="~{fragments/layout :: head('修改密码')}"></head>
<body>

<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="fh-center">
<div class="fh-card">
    <h1 class="fh-title">修改密码</h1>
    <p class="fh-sub">改完需要用新密码重新登录一次。</p>

    <!-- 校验失败的提示（由 Controller 塞进 model 的 error）；B 类：失败 -->
    <div class="fh-alert fh-alert-err" th:if="${error}">
        <svg th:replace="~{fragments/icons :: ic-warn}"></svg>
        <span th:text="${error}">出错了</span>
    </div>

    <!-- 🔒【2026-10-07】首次登录被强制改密时的说明。
         不说清楚的话，用户会以为"点哪个链接都被弹回来 = 系统坏了"。
         mustChange 由 PasswordController 的 GET 塞进 model（读的是 must_change_password 列）。 -->
    <div class="fh-alert fh-alert-warn" th:if="${mustChange}">
        <svg th:replace="~{fragments/icons :: ic-warn}"></svg>
        <span>这是你第一次用这个密码登录。<b>请先设置你自己的新密码</b> —— 改完之前，其它页面都进不去。</span>
    </div>

    <!--
        ⚠️ 必须用 th:action —— 它会自动插入 CSRF 隐藏字段。
        写成普通的 action，提交会被 403 拒绝（和登录页是同一个道理）。
    -->
    <form th:action="@{/me/password}" method="post">

        <div style="margin-bottom:14px">
            <label for="oldPassword">当前密码</label>
            <input type="password" id="oldPassword" name="oldPassword" required autofocus>
        </div>

        <div style="margin-bottom:14px">
            <label for="newPassword">新密码</label>
            <input type="password" id="newPassword" name="newPassword" required>
            <span class="form-text">至少 8 位</span>
        </div>

        <div style="margin-bottom:14px">
            <label for="confirmPassword">再输一次新密码</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required>
        </div>

        <button type="submit" class="fh-btn fh-btn-main" style="width:100%">确认修改</button>
    </form>

    <p class="fh-sub" style="margin:18px 0 0;text-align:center">
        <a th:href="@{/me}">← 回到我的主页</a>
    </p>
</div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
