<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--
  学员详情与编辑（T-012 / T-016；T-043 视觉落地）

  ⭐ 这一页有三种性质不同的区域，必须【视觉可分】：
     ① 账号信息 = 只读（.fh-info + .fh-ro）
     ② 编辑资料 = 可编辑（正常输入框）
     ③ 账号管理 = 危险区（左侧 4px 红条 + 仅老师/正社长可见）
  🔒 手机号：本页属于 /admin/**，按 docs/spec.md §3.3 修订后【可以显示】
     （社长要联系学员的实际需要）；但公开页面一律不许出现。
-->
<head th:replace="~{fragments/layout :: head('学员详情')}"></head>
<body>

<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="fh-page">

    <p class="fh-sub"><a th:href="@{/admin/students}">← 返回学员列表</a></p>

    <!-- 提示：A 成功 / B 失败（由 RedirectAttributes 的 flash 传过来） -->
    <div class="fh-alert fh-alert-ok" th:if="${saved}">
        <svg th:replace="~{fragments/icons :: ic-check-circle}"></svg>
        <span th:text="${saved}">已保存</span>
    </div>
    <div class="fh-alert fh-alert-err" th:if="${error}">
        <svg th:replace="~{fragments/icons :: ic-warn}"></svg>
        <span th:text="${error}">出错了</span>
    </div>

    <!-- ============ 区块 1：账号信息（只读）============ -->
    <div class="fh-card">
        <h1 class="fh-title" th:text="${user.realName}">张三</h1>
        <p class="fh-sub" th:text="'学号：' + (${user.studentNo} ?: '—')">学号：2025001</p>

        <table class="fh-info">
            <tr><td>用户名</td><td class="fh-ro" th:text="${user.username}">zhangsan</td></tr>
            <tr><td>角色</td><td class="fh-ro" th:text="${user.role.label}">学员</td></tr>
            <tr><td>状态</td><td class="fh-ro" th:text="${user.status.label}">在读</td></tr>
            <tr>
                <td>最后登录</td>
                <td class="fh-ro mono" th:text="${user.lastLoginAt} ?: '从未登录过'">从未登录过</td>
            </tr>
            <!--
                🔒 手机号：按 2026-10-02 修订后的 spec 第 3.3 节，
                    【公开页面】一律不许出现，但【管理员后台】可见（社长要联系学员）。
                    本页属于 /admin/**，所以这里可以显示。
            -->
            <tr><td>手机号</td><td class="fh-ro mono" th:text="${user.phone} ?: '—'">13800000003</td></tr>
            <tr><td>注册时间</td><td class="fh-ro mono" th:text="${user.createdAt}">2026-10-02</td></tr>
        </table>
    </div>

    <!-- ============ 区块 2：编辑资料（可编辑）============ -->
    <div class="fh-card">
        <p class="fh-sec-title">编辑资料</p>

        <form th:action="@{/admin/students/{uid}(uid=${user.id})}" method="post">
            <div class="row g-3">
                <div class="col-md-4">
                    <label for="realName">真实姓名</label>
                    <input type="text" id="realName" name="realName" class="form-control"
                           th:value="${user.realName}" required>
                </div>
                <div class="col-md-4">
                    <label for="studentNo">学号</label>
                    <input type="text" id="studentNo" name="studentNo" class="form-control"
                           th:value="${user.studentNo}" required>
                </div>
                <div class="col-md-4">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" class="form-control"
                           th:value="${user.username}" required>
                </div>
                <div class="col-md-4">
                    <label for="phone">手机号</label>
                    <input type="text" id="phone" name="phone" class="form-control"
                           th:value="${user.phone}" placeholder="11 位">
                </div>
                <div class="col-md-4">
                    <label for="grade">年级</label>
                    <input type="text" id="grade" name="grade" class="form-control"
                           th:value="${profile?.grade}">
                </div>
                <div class="col-md-4">
                    <label for="majorClass">专业 / 班级</label>
                    <input type="text" id="majorClass" name="majorClass" class="form-control"
                           th:value="${profile?.majorClass}">
                </div>
                <!--
                    🔄 T-016：所属组。这是设置 users.group_id 的【唯一入口】——
                       没有它，学员永远进不了组，学员列表的「组」列就会一直是空的。
                    ⚠️ 空选 = 未分组（数据库允许 group_id 为 NULL）。
                    📌 「谁是组长」不在这里设 —— 那在 /admin/groups 页面（组长是派生身份）。
                -->
                <div class="col-md-4">
                    <label for="groupId">所属组</label>
                    <select id="groupId" name="groupId" class="form-select">
                        <option value="">（未分组）</option>
                        <option th:each="g : ${allGroups}"
                                th:value="${g.id}"
                                th:text="${g.name}"
                                th:selected="${user.groupId != null and user.groupId == g.id}">示例组</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="qq">QQ</label>
                    <input type="text" id="qq" name="qq" class="form-control" th:value="${profile?.qq}">
                </div>
                <div class="col-md-4">
                    <label for="wechat">微信</label>
                    <input type="text" id="wechat" name="wechat" class="form-control" th:value="${profile?.wechat}">
                </div>
                <div class="col-md-4">
                    <label for="email">邮箱</label>
                    <input type="text" id="email" name="email" class="form-control" th:value="${profile?.email}">
                </div>
                <div class="col-md-6">
                    <label for="languages">擅长的语言</label>
                    <input type="text" id="languages" name="languages" class="form-control"
                           th:value="${profile?.languages}" placeholder="示例：Python,C++">
                </div>
                <div class="col-md-3">
                    <label for="level">阶段</label>
                    <select id="level" name="level" class="form-select">
                        <option value="">（未设置）</option>
                        <option th:each="lv : ${allLevels}"
                                th:value="${lv.name()}"
                                th:text="${lv.label}"
                                th:selected="${profile?.level != null and profile.level.name() == lv.name()}">入门</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="joinDate">入社日期</label>
                    <input type="date" id="joinDate" name="joinDate" class="form-control"
                           th:value="${profile?.joinDate}">
                </div>
            </div>

            <button type="submit" class="fh-btn fh-btn-main" style="margin-top:18px">保存</button>
        </form>
    </div>

    <!--
        ============ 区块 3：账号管理（危险区）============
        sec:authorize 让"副社长"根本看不到这一块（页面层面）。
        但真正的防线在服务器端：那两个接口上写着 @PreAuthorize ——
        就算有人绕过页面直接发请求，也会被 403 挡住（两道锁）。
    -->
    <div class="fh-card fh-danger-card" sec:authorize="hasAnyRole('TEACHER','PRESIDENT')">
        <p class="fh-sec-title">账号管理（仅指导老师 / 正社长可见）</p>

        <div class="row g-4">
            <div class="col-md-6">
                <form th:action="@{/admin/students/{uid}/status(uid=${user.id})}" method="post">
                    <label for="status">账号状态</label>
                    <div class="fh-flex" style="flex-wrap:nowrap">
                        <select id="status" name="status" class="form-select">
                            <option th:each="st : ${allStatuses}"
                                    th:value="${st.name()}"
                                    th:text="${st.label}"
                                    th:selected="${user.status.name() == st.name()}">在读</option>
                        </select>
                        <button type="submit" class="fh-btn fh-btn-outline fh-btn-sm fh-nowrap">更新状态</button>
                    </div>
                    <div class="form-text">改成「已禁用」后，该账号立刻无法登录。</div>
                </form>
            </div>

            <div class="col-md-6">
                <form th:action="@{/admin/students/{uid}/role(uid=${user.id})}" method="post">
                    <label for="role">角色</label>
                    <div class="fh-flex" style="flex-wrap:nowrap">
                        <select id="role" name="role" class="form-select">
                            <option th:each="r : ${allRoles}"
                                    th:value="${r.name()}"
                                    th:text="${r.label}"
                                    th:selected="${user.role.name() == r.name()}">学员</option>
                        </select>
                        <button type="submit" class="fh-btn fh-btn-outline fh-btn-sm fh-nowrap">更新角色</button>
                    </div>
                    <div class="form-text">改角色等于发权限，请谨慎。</div>
                </form>
            </div>
        </div>

        <p class="fh-sub" style="margin:18px 0 0">
            密码重置已取消 —— 将来由学员在登录页提交「忘记密码」申请、社长审核（T-012B）。
        </p>
    </div>

</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
