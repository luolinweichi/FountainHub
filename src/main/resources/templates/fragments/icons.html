<!DOCTYPE html>
<!--
  ============================================================================
  内联 SVG 图标集（T-043 视觉落地）
  ============================================================================
  【为什么要有这个文件】
    docs/08 §8 明确要求：**禁止用 emoji 当图标系统**（📅👤🔑 这种），
    并且**不依赖图标字体 CDN**（沙箱没外网，对方浏览器也可能加载不到）。
    所以全站图标统一用**内联 SVG**：线稿风、1.5px 描边、currentColor 取色。

  【怎么用】一行就够：
      <svg th:replace="~{fragments/icons :: ic-calendar}"></svg>
    颜色跟着父元素的 color 走（stroke="currentColor"），
    大小由 CSS 控制（fh.css 里给 .fh-func-icon svg 等设了 width/height）。

  【为什么放 fragment 而不是复制粘贴】
    同一个图标在多个页面用到（日历图标出现在 /me 和 /me/attendance）。
    复制粘贴的话改一次要改 N 处 —— 和当初抽出 layout.html 是同一个理由。
  ============================================================================
-->
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 用户 / 我的资料 -->
<svg th:fragment="ic-user" width="1em" height="1em" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="3.6"/>
    <path d="M4.6 20c0-3.6 3.3-6 7.4-6s7.4 2.4 7.4 6"/>
</svg>

<!-- 日历 / 考勤签到 -->
<svg th:fragment="ic-calendar" width="1em" height="1em" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="5" width="17" height="15.5" rx="3"/>
    <path d="M3.5 9.6h17M8 3.5v3M16 3.5v3"/>
    <path d="M7.6 13.4h2.2M12.2 13.4h2.2M7.6 17h2.2M12.2 17h2.2"/>
</svg>

<!-- 钥匙 / 密码 -->

    <path d="M4 5.2A2.2 2.2 0 0 1 6.2 3H19v15.2H6.2A2.2 2.2 0 0 0 4 20.4z"/>
    <path d="M4 20.4A2.2 2.2 0 0 1 6.2 18.2H19V21H6.2A2.2 2.2 0 0 1 4 18.8z"/>

<!-- 多人 / 学员管理 -->

    <circle cx="9" cy="8.4" r="3.4"/>

    <path d="M16.5 9h2.2A1.3 1.3 0 0 1 20 10.3v6.2a2 2 0 0 1-2 2h-1.5"/>

    <path d="M13 3.5v5h5"/>

    <path d="M13.6 6.6l3.8 3.8"/>

    <path d="M12 5.5v13M5.5 12h13"/>

<!-- 锁 / 隐私 -->
<svg th:fragment="ic-lock" width="1em" height="1em" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.6" y="10.2" width="14.8" height="10.3" rx="2.6"/>
    <path d="M8.2 10.2V7.6a3.8 3.8 0 0 1 7.6 0v2.6"/>

<!-- 眼睛 / 可见范围 -->

    <path d="M2.4 12S5.9 5.8 12 5.8 21.6 12 21.6 12 18.1 18.2 12 18.2 2.4 12 2.4 12z"/>

<!-- 勾选圆 / 已完成 -->

     stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8.6"/>

</svg>

<!-- 空圆 / 未完成 -->
<svg th:fragment="ic-circle-off" width="1em" height="1em" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8.6"/>
</svg>

<!-- 对勾（简单） -->
<svg th:fragment="ic-check" width="1em" height="1em" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 12.6l4.6 4.6L19 6.8"/>
</svg>

<!-- 信息圆 -->
<svg th:fragment="ic-info" width="1em" height="1em" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"

    <path d="M12 11v5.2M12 8.1v.1"/>

<!-- 叉 / 失败 -->
<svg th:fragment="ic-x" width="1em" height="1em" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.6 6.6l10.8 10.8M17.4 6.6L6.6 17.4"/>
</svg>

<!-- 放大镜 / 搜索 -->
<svg th:fragment="ic-search" width="1em" height="1em" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"

     stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">

<svg th:fragment="ic-hammer" width="1em" height="1em" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13.6 6.6l3.8-3.8 3.8 3.8-3.8 3.8z"/>
    <path d="M15.5 10.4L6.2 19.7l-1.9-1.9L13.6 8.5"/>
</svg>

<!-- 日历打勾 / 签到成功 -->
<svg th:fragment="ic-calendar-check" width="1em" height="1em" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="5" width="17" height="15.5" rx="3"/>
    <path d="M3.5 9.6h17M8 3.5v3M16 3.5v3"/>
    <path d="M8.8 14.6l2.3 2.3 4.1-4.3"/>
</svg>

<!-- ⭐ 双拱水幕弧线组（装饰语言之二，用于首页 Hero 角落） -->
<svg th:fragment="ic-arch-deco" width="1em" height="1em" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 120" fill="none"
     stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
    <!-- 【2026-10-04 按设计稿重画】
         原版 viewBox="0 0 180 150" 是【偏竖】的，图形被竖着拉长，看起来又高又窄；
         设计稿里那两条拱是【扁而宽】的（宽:高 约 2:1）。
         所以：viewBox 改 210x120，两条大拱的半径加大、高度压低，中间的座拱跟着压扁。
         颜色仍由 stroke="currentColor" 从父元素继承 —— 这里【不碰颜色】。 -->
    <path d="M16 106c0-36 20-58 50-58s50 22 50 58"/>
    <path d="M94 106c0-36 20-58 50-58s50 22 50 58"/>
    <path d="M8 106h194"/>
    <path d="M73 48c0-13 9-22 22-22s22 9 22 22" opacity=".65"/>
    <path d="M95 6c.8 6.2 3.8 9.2 10 10-6.2.8-9.2 3.8-10 10-.8-6.2-3.8-9.2-10-10 6.2-.8 9.2-3.8 10-10z"/>
</svg>

<!-- 💻 代码尖括号 / 刷题（T-030 学习页三卡之一；设计稿 #19 用的是 `<>`） -->
<svg th:fragment="ic-code" width="1em" height="1em" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 7.6L4.6 12 9 16.4M15 7.6L19.4 12 15 16.4"/>
</svg>

     stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8.4"/>

</svg>

</body>
