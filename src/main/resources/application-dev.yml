# =====================================================================
# 开发期专用设置（R-002 从 application.yml 拆出来的）
# =====================================================================
# 【为什么要拆】
#   原来 `show-sql: true` 和 `com.fountainhub: debug` 写死在主配置里，
#   部署到服务器后会把 SQL 和调试日志全打出来（可能含手机号等敏感数据），还拖慢性能。
#
# 【怎么用】
#   平时启动：什么都不用加（`application.yml` 里默认 `active: local,dev`）→ 行为和以前一模一样
#   部署时：`--spring.profiles.active=local,prod` → 这两个设置就不生效了
#
# 【⚠️ 不要把它们改回 application.yml】那会让生产环境重新暴露 SQL 日志。
# =====================================================================

spring:
  jpa:
    # 把 Hibernate 生成的 SQL 打印到控制台，学习阶段非常有用
    show-sql: true

# 开发期把本项目的日志放宽到 debug，方便排查
logging:
  level:
    com.fountainhub: debug
